services:
  - type: web
    name: insightflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_BATCH_SIZE
        value: "25"
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
